
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" fill="none">
  <defs>
    <linearGradient id="coralGlow" x1="920" y1="120" x2="1350" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF8A5B" stop-opacity=".12"/>
      <stop offset="1" stop-color="#FF8A5B" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="780" y1="80" x2="1300" y2="650" gradientUnits="userSpaceOnUse">
